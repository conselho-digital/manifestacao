<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Armas nas mãos</title>
<style>
  :root { --bg:#12161c; --panel:#1a2029; --line:#2b3441; --fg:#e8edf3; --dim:#93a1b3; --acc:#3fbf6f; --acc2:#f2c230; --warn:#e5694a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns: 270px minmax(0,1fr) 340px; height:100%; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; min-height:0; }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  h2 { margin:0; padding:12px 14px 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .item { display:flex; align-items:center; gap:10px; width:100%; padding:7px 12px; background:none; border:0; border-left:3px solid transparent; color:var(--fg); cursor:pointer; text-align:left; font:inherit; }
  .item:hover { background:#222b37; }
  .item.on { background:#243040; border-left-color:var(--acc); color:var(--fg); }
  button.item.on { color:var(--fg); font-weight:400; }
  .item img { width:64px; height:32px; object-fit:contain; background:#0e1217; border-radius:4px; flex:none; }
  .item .nm { flex:1; min-width:0; }
  .item .dot { width:9px; height:9px; border-radius:50%; background:var(--acc2); flex:none; visibility:hidden; }
  .item.mod .dot { visibility:visible; }
  main { position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; }
  #view { flex:1; min-height:0; position:relative; }
  #view canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { position:absolute; left:12px; top:10px; right:12px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 10px; background:var(--panel); border-top:1px solid var(--line); }
  .seg { display:flex; gap:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  button, select, input[type=number], textarea { font:inherit; color:var(--fg); background:#222b37; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  button:hover { background:#2b3748; }
  button.on { background:var(--acc); border-color:var(--acc); color:#08130c; font-weight:600; }
  button.warn:hover { background:var(--warn); border-color:var(--warn); }
  .pad { padding:0 14px 14px; }
  .row { display:grid; grid-template-columns: 118px minmax(0,1fr) 66px; gap:8px; align-items:center; margin:7px 0; }
  .row label { color:var(--dim); }
  .row input[type=range] { width:100%; accent-color:var(--acc); }
  .row input[type=number] { width:100%; padding:4px 6px; }
  .hint { color:var(--dim); font-size:12px; margin:2px 0 8px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  #status { min-height:18px; color:var(--acc2); font-size:12px; padding:0 14px 8px; }
  textarea { width:100%; height:140px; font:12px ui-monospace, Menlo, Consolas, monospace; resize:vertical; }
  .title { padding:12px 14px 0; font-size:17px; font-weight:600; }
  #load { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,13,18,.85); font-size:16px; z-index:5; }
  .axis { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  @media (max-width: 1000px) { #app { grid-template-columns: 200px minmax(0,1fr) 300px; } .item img { display:none; } }
</style>
</head>
<body>
<div id="app">
  <aside id="list"></aside>
  <main>
    <div id="view"><div id="load">Carregando personagem…</div><div id="hud"></div></div>
    <div class="bar" id="poses"></div>
    <div class="bar" id="camb"></div>
  </main>
  <aside class="right" id="ctl"></aside>
</div>
<script type="module" src="/src/editor/armas.ts"></script>
</body>
</html>
