name: Revisor de código

# Bot de revisão: lint, tipos, build, tamanho e regras do projeto.
# Não usa segredos nem serviços pagos.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: revisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Tipos (tsc)
        id: tipos
        continue-on-error: true
        run: npm run typecheck
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Tamanho do jogo
        id: tamanho
        continue-on-error: true
        run: npm run check:size | tee tamanho.txt
      - name: Regras do projeto (mudanças do PR)
        id: regras
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/review-checks.mjs "${BASE_SHA:-HEAD~1}" | tee regras.txt; exit "${PIPESTATUS[0]}"

      - name: Comentar resultado no PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          LINT: ${{ steps.lint.outcome }}
          TIPOS: ${{ steps.tipos.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TAMANHO: ${{ steps.tamanho.outcome }}
          REGRAS: ${{ steps.regras.outcome }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8').trim() : '');
            const icon = (o) => (o === 'success' ? '✅' : '❌');
            const e = process.env;
            const body = [
              '<!-- bot-revisor -->',
              '## 🤖 Revisor de código',
              `${icon(e.LINT)} Lint · ${icon(e.TIPOS)} Tipos · ${icon(e.BUILD)} Build · ${icon(e.TAMANHO)} Tamanho · ${icon(e.REGRAS)} Regras`,
              '',
              '**Tamanho do jogo**',
              '```', read('tamanho.txt') || 'sem dados', '```',
              read('regras.txt'),
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.includes('<!-- bot-revisor -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Falhar se algo deu errado
        if: steps.lint.outcome != 'success' || steps.tipos.outcome != 'success' || steps.build.outcome != 'success' || steps.tamanho.outcome != 'success' || steps.regras.outcome != 'success'
        run: |
          echo "Lint: ${{ steps.lint.outcome }} | Tipos: ${{ steps.tipos.outcome }} | Build: ${{ steps.build.outcome }} | Tamanho: ${{ steps.tamanho.outcome }} | Regras: ${{ steps.regras.outcome }}"
          exit 1
