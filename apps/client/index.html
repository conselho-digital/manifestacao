<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15181d" />
    <title>Manifestação Online — protótipo 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;

        /* Superfícies (asfalto noturno) */
        --bg: #15181d;
        --surface: #1e232b;
        --surface-2: #272d37;
        --line: #333b46;

        /* Tinta */
        --ink: #f2f4f7;
        --ink-dim: #9aa4b2;

        /* Acento = amarelo de faixa/placa (amarra com a cena 3D) */
        --accent: #ffd12e;
        --on-accent: #15181d;

        --scrim: rgba(21, 24, 29, 0.78);

        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;

        /* Escala tipográfica: um grande, um pequeno, nada no meio */
        --t-display: clamp(34px, 11vw, 52px);
        --t-body: 16px;
        --t-ui: 13px;

        --font-display: "Anton", system-ui, sans-serif;
        --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: var(--font-ui);
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      button,
      input {
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
