<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15181d" />
    <title>Manifestação Online — jogo 3D multiplayer na avenida</title>
    <meta
      name="description"
      content="Jogo online, multiplayer e 3D: uma manifestação satírica numa avenida virtual. Escolha sua equipe, converse, pixe, use bandeiras, cartazes e veículos. Joga no celular e no PC."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manifestação" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Manifestação Online" />
    <meta property="og:description" content="Jogo 3D multiplayer, satírico, numa avenida virtual. Entre com sua conta Google e jogue no navegador." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;

        /* Superfícies (asfalto noturno) */
        --bg: #15181d;
        --surface: #1e232b;
        --surface-2: #272d37;
        --line: #333b46;

        /* Tinta */
        --ink: #f2f4f7;
        --ink-dim: #9aa4b2;

        /* Acento = amarelo de faixa/placa (amarra com a cena 3D) */
        --accent: #ffd12e;
        --on-accent: #15181d;

        --scrim: rgba(21, 24, 29, 0.78);
        --danger: #ff6b6b;

        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;

        /* Escala tipográfica: um grande, um pequeno, nada no meio */
        --t-display: clamp(34px, 11vw, 52px);
        --t-body: 16px;
        --t-ui: 13px;

        --font-display: "Anton", system-ui, sans-serif;
        --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      .legal-body h2 { font-size: 18px; margin: 28px 0 8px; }
      .legal-body p, .legal-body li { color: var(--ink); margin: 0 0 12px; }
      .legal-body ul { padding-left: 20px; margin: 0 0 12px; }
      /* Nomes flutuantes (drei Html) somem enquanto um menu está aberto. */
      body[data-modal-open] .avatar-name {
        display: none !important;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: var(--font-ui);
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      button,
      input {
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      summary {
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        content: "+";
        color: var(--ink-dim);
        font-weight: 400;
      }
      details[open] summary::after {
        content: "–";
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
