<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Criar personagens</title>
<style>
  :root { --bg:#12161c; --panel:#1a2029; --line:#2b3441; --fg:#e8edf3; --dim:#93a1b3; --acc:#3fbf6f; --acc2:#f2c230; --warn:#e5694a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns: 300px minmax(0,1fr) 340px; height:100%; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; min-height:0; }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  h2 { margin:0; padding:12px 14px 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; padding:2px 12px 10px; }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px; background:#222b37; border:2px solid transparent; border-radius:10px; color:var(--fg); cursor:pointer; font:inherit; font-size:11px; }
  .tile:hover { background:#2b3748; }
  .tile.on { border-color:var(--acc); background:#243040; color:var(--fg); font-weight:400; }
  .tile img, .tile .ph { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:#0e1217; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .tile .x { position:absolute; right:2px; top:2px; width:20px; height:20px; padding:0; border-radius:50%; line-height:1; font-size:12px; background:rgba(0,0,0,.6); }
  main { position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; }
  #view { flex:1; min-height:0; position:relative; }
  #view canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 10px; background:var(--panel); border-top:1px solid var(--line); }
  button, select, input[type=number], input[type=text] { font:inherit; color:var(--fg); background:#222b37; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  button:hover { background:#2b3748; }
  button.on { background:var(--acc); border-color:var(--acc); color:#08130c; font-weight:600; }
  button.go { background:var(--acc); border-color:var(--acc); color:#08130c; font-weight:650; }
  button.warn:hover { background:var(--warn); border-color:var(--warn); }
  button:disabled { opacity:.5; cursor:default; }
  .pad { padding:0 14px 12px; }
  .row { display:grid; grid-template-columns: 112px minmax(0,1fr) 62px; gap:8px; align-items:center; margin:6px 0; }
  .row label { color:var(--dim); }
  .row input[type=range] { width:100%; accent-color:var(--acc); }
  .row input[type=number] { width:100%; padding:4px 6px; }
  .tint { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .tint label { flex:1; color:var(--dim); }
  .tint input[type=color] { width:44px; height:28px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; }
  .hint { color:var(--dim); font-size:12px; margin:2px 0 8px; }
  .title { padding:12px 14px 0; font-size:17px; font-weight:600; }
  #status { min-height:18px; color:var(--acc2); font-size:12px; padding:0 14px 8px; white-space:pre-wrap; }
  #who { padding:6px 14px 0; font-size:12px; color:var(--dim); }
  #who.ok { color:var(--acc); }
  #load { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,13,18,.85); font-size:16px; z-index:5; }
  input[type=text] { width:100%; }
  .saved { display:flex; align-items:center; gap:8px; padding:5px 14px; cursor:pointer; }
  .saved:hover { background:#222b37; }
  .saved.on { background:#243040; }
  .saved img { width:40px; height:40px; border-radius:6px; object-fit:cover; }
  .saved span { flex:1; }
  @media (max-width: 1000px) { #app { grid-template-columns: 220px minmax(0,1fr) 300px; } }
</style>
</head>
<body>
<div id="app">
  <aside id="list"></aside>
  <main>
    <div id="view"><div id="load">Carregando…</div></div>
    <div class="bar" id="poses"></div>
  </main>
  <aside class="right" id="ctl"></aside>
</div>
<input type="file" id="glb" accept=".glb,model/gltf-binary" hidden>
<script type="module" src="/src/editor/personagens.ts"></script>
</body>
</html>
